name: Label Test Review Refresh

# Generated by the central Label Sync repository. Do not edit by hand: this file is
# overwritten on every distribution run. See the note in label-test.yml about the
# deliberately wide permission grant.

on:
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read

jobs:
  refresh-label-test:
    name: Refresh Label Test
    permissions:
      actions: write
      contents: read
      checks: write
      pull-requests: read
    uses: Achrobat/Achrobat-Label-Sync/.github/workflows/96-refresh-label-test.yml@master
    with:
      label_sync_repository: Achrobat/Achrobat-Label-Sync
      label_sync_ref: master
    secrets: inherit
