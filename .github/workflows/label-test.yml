name: Label Test

# Generated by the central Label Sync repository. Do not edit by hand: this file is
# overwritten on every distribution run. Behaviour lives in the reusable workflow
# referenced below, which is pinned to a branch so logic changes arrive automatically.
#
# The permission grant below is deliberately wider than the reusable workflow currently
# uses. The effective token is the intersection of the two, so the reusable workflow stays
# least-privilege while new capabilities can be enabled centrally without redistributing
# this file. Unused permissions cost nothing.
#
# The trigger list is deliberately NOT padded the same way. This workflow publishes a
# required check, so every extra trigger spins a runner and flips the pull request to
# pending while it reruns. Each type below earns its place:
#   labeled / unlabeled                     the policy input itself
#   opened / reopened / ready_for_review    the check has to report at all
#   synchronize                             a status check is bound to a commit SHA, so a
#                                           new head commit needs a fresh run or the check
#                                           reads as missing forever
# Review state is handled separately: pull_request_review drives the refresh workflow,
# which reruns this check. That is why review_requested is absent here: requesting a
# reviewer does not change the approval count, so it cannot change the verdict.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read

jobs:
  label-test:
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
      statuses: write
    uses: Achrobat/Achrobat-Label-Sync/.github/workflows/97-label-test.yml@master
    with:
      label_sync_repository: Achrobat/Achrobat-Label-Sync
      label_sync_ref: master
    secrets: inherit
